<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ScamShield India</title>
  <style>
    :root{--bg:#0f1420;--card:#171e2e;--tx:#e8ecf4;--mut:#8b96ad;--ln:#26304a}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif}
    main{max-width:760px;margin:0 auto;padding:28px 16px}h1{margin:0 0 4px}p.sub{color:var(--mut);margin:0 0 20px}
    .card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:16px;margin-top:14px}
    input,select,button{font:inherit;border-radius:8px;border:1px solid var(--ln);background:#0c1120;color:var(--tx);padding:10px}
    input{width:100%;margin-bottom:8px}.row{display:flex;gap:8px}.row>*{flex:1}
    button{background:#3b6cff;border:0;cursor:pointer;font-weight:600}button:disabled{opacity:.5}
    .badge{display:inline-block;padding:4px 12px;border-radius:99px;font-weight:700}
    .LOW{background:#14532d}.MEDIUM{background:#854d0e}.HIGH{background:#9a3412}.CRITICAL{background:#991b1b}
    h3{margin:14px 0 4px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
    ul{margin:0;padding-left:18px}a{color:#8fb0ff}.ev{border-top:1px solid var(--ln);padding:8px 0}.ev small{color:var(--mut)}
    .warn{color:#fbbf24}.chips button{background:#222c45;padding:6px 10px;font-weight:400;margin:2px}
  </style>
</head>
<body>
  <main>
    <h1>🛡️ ScamShield India</h1>
    <p class="sub">Check a phone number, UPI ID, website or "customer care" search against live search evidence.</p>
    <div class="card">
      <input id="q" placeholder="+91 98765 43210 · support@sbi · sbi-care-help.xyz · SBI customer care">
      <div class="row">
        <input id="b" placeholder="Claimed brand (optional)">
        <select id="l">
          <option value="en">English</option>
          <option value="hi">हिन्दी</option>
          <option value="mr">मराठी</option>
        </select>
      </div>
      <button id="go">Investigate</button>
      <div class="chips" id="ex"></div>
    </div>
    <div id="out"></div>
  </main>
  <script>
    const $=id=>document.getElementById(id);
    const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const safe=u=>/^https?:\/\//i.test(u||"")?esc(u):"#";
    const list=(t,a)=>a&&a.length?`<h3>${t}</h3><ul>${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"";
    ["SBI customer care helpline","sbi-helpline-support.xyz","hdfcbank.net","support@okaxis"].forEach(x=>{
      const b=document.createElement("button");b.textContent=x;b.onclick=()=>{$("q").value=x;go()};$("ex").appendChild(b)});
    async function go(){
      const q=$("q").value.trim();if(q.length<3)return;
      $("go").disabled=true;$("go").textContent="Investigating…";$("out").innerHTML="";
      try{
        const r=await fetch("/api/v1/investigate",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({query:q,claimed_brand:$("b").value.trim()||null,language:$("l").value})});
        const d=await r.json();if(!r.ok)throw new Error(d.detail||r.status);
        const oc=d.official_contacts;
        $("out").innerHTML=`<div class="card">
          <span class="badge ${d.risk_level}">${d.risk_level} · ${d.risk_score}/100</span>
          <small> confidence ${esc(d.confidence)} · ${esc(d.input_type)}</small>
          <p>${esc(d.summary)}</p>
          ${d.warnings.map(w=>`<p class="warn">⚠ ${esc(w)}</p>`).join("")}
          ${list("Risk factors",d.risk_factors)}${list("Recommended actions",d.recommended_actions)}
          ${list("Not verified",d.unverified_points)}
          ${oc?`<h3>Official contacts: ${esc(oc.display_name)}</h3><ul><li>Websites: ${esc(oc.domains.join(", "))}</li><li>Helplines: ${esc(oc.helplines.join(", "))}</li></ul>`:""}
          <h3>Why (signals)</h3><ul>${d.signals.map(s=>`<li><b>${esc(s.signal_name)}</b> (${s.score_impact>0?"+":""}${s.score_impact}): ${esc(s.description)}</li>`).join("")}</ul>
          <h3>Evidence (${d.evidence.length})</h3>
          ${d.evidence.map(e=>`<div class="ev"><small>${esc(e.source_type)}</small><br><a href="${safe(e.url)}" target="_blank" rel="noopener noreferrer">${esc(e.title)}</a><br><small>${esc(e.snippet)}</small></div>`).join("")}
        </div>`;
      }catch(e){$("out").innerHTML=`<div class="card warn">Error: ${esc(e.message)}</div>`}
      $("go").disabled=false;$("go").textContent="Investigate";
    }
    $("go").onclick=go;$("q").addEventListener("keydown",e=>e.key==="Enter"&&go());
  </script>
</body>
</html>
