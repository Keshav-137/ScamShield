<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ScamShield India</title>
<style>
:root{--bg:#0d1220;--card:#161d2f;--tx:#e8ecf4;--mut:#8b96ad;--ln:#26304a;--ac:#3b6cff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif}
header{max-width:900px;margin:0 auto;padding:18px 16px 0}h1{margin:0;font-size:22px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.chip{font-size:12px;padding:2px 9px;border-radius:99px;background:#222c45;color:var(--mut)}
.chip.ok{color:#86efac}.chip.no{color:#fca5a5}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}nav button{background:#1c2540;border:1px solid var(--ln);color:var(--mut)}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:900px;margin:0 auto;padding:6px 16px 40px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:16px;margin-top:14px}
input,textarea,select,button{font:inherit;border-radius:8px;border:1px solid var(--ln);background:#0b101d;color:var(--tx);padding:10px}
input,textarea{width:100%;margin-bottom:8px}textarea{min-height:110px;resize:vertical}
button{background:var(--ac);border:0;cursor:pointer;font-weight:600;color:#fff}button:disabled{opacity:.5;cursor:wait}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.hide{display:none}.warn{color:#fbbf24}
.badge{display:inline-block;padding:4px 12px;border-radius:99px;font-weight:700}
.LOW{background:#14532d}.MEDIUM{background:#854d0e}.HIGH{background:#9a3412}.CRITICAL{background:#991b1b}
h3{margin:14px 0 4px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
ul{margin:0;padding-left:18px}a{color:#8fb0ff}small,.mut{color:var(--mut)}
.ev{border-top:1px solid var(--ln);padding:8px 0;word-break:break-word}
#log{list-style:none;padding:0;margin:0;font:12px/1.7 ui-monospace,monospace;color:var(--mut)}
#log .ok{color:#86efac}#log .bad{color:#fca5a5}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:#0f1526;border:1px solid var(--ln);border-radius:10px;padding:12px}.stat b{font-size:24px;display:block}
.bar{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:13px}.bar i{display:block;height:10px;border-radius:5px;background:var(--ac)}
.bar span{min-width:120px;color:var(--mut)}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:5px 6px;border-top:1px solid var(--ln);text-align:left}
.ex button{background:#222c45;padding:5px 10px;font-weight:400;margin:2px;font-size:13px}
</style></head><body>
<header>
  <h1>🛡️ ScamShield India</h1>
  <div class="mut">Verify numbers, UPI IDs, links, messages and apps against live search evidence.</div>
  <div class="chips" id="health"></div>
  <nav id="nav">
    <button data-t="check" class="on">Check</button><button data-t="msg">Message</button>
    <button data-t="shot">Screenshot</button><button data-t="app">Fake app</button><button data-t="dash">Dashboard</button>
    <select id="lang" style="margin-left:auto;flex:0"><option value="en">English</option><option value="hi">हिन्दी</option><option value="mr">मराठी</option></select>
  </nav>
</header>
<main>
<section id="t-check" class="tab card">
  <input id="q" placeholder="Phone · UPI ID · website · 'SBI customer care'">
  <input id="b" placeholder="Brand it claims to be (optional)">
  <button id="go">Investigate</button>
  <div class="ex" id="ex"></div>
</section>
<section id="t-msg" class="tab card hide">
  <textarea id="m" placeholder="Paste the SMS / WhatsApp message here"></textarea>
  <button id="gom">Analyze message</button>
</section>
<section id="t-shot" class="tab card hide">
  <input id="f" type="file" accept="image/png,image/jpeg,image/webp">
  <button id="gos">Analyze screenshot</button>
  <div class="mut" style="margin-top:6px">Needs a Gemini or Claude key. The image is sent to that AI provider and is not stored by this app.</div>
</section>
<section id="t-app" class="tab card hide">
  <input id="an" placeholder="App name, e.g. SBI YONO">
  <input id="ab" placeholder="Brand (optional)">
  <button id="goa">Check app</button>
</section>
<section id="t-dash" class="tab hide"><div id="dash"></div></section>
<div id="progress" class="card hide"><ul id="log"></ul></div>
<div id="out"></div>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe=u=>/^https?:\/\//i.test(u||"")?esc(u):"#";
const list=(t,a)=>a&&a.length?`<h3>${t}</h3><ul>${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"";
let busy=false,dashTimer=null,last=null;

function show(tab){
  document.querySelectorAll(".tab").forEach(s=>s.classList.toggle("hide",s.id!=="t-"+tab));
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
  $("out").innerHTML="";$("progress").classList.add("hide");
  clearInterval(dashTimer);
  if(tab==="dash"){loadDash();dashTimer=setInterval(loadDash,20000);}
}
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>show(b.dataset.t));
["SBI customer care helpline","sbi-helpline-support.xyz","1800 1234","Zomato customer care number","sbi.care@okaxis"].forEach(x=>{
  const b=document.createElement("button");b.textContent=x;b.onclick=()=>{$("q").value=x;$("go").click()};$("ex").appendChild(b)});

function setBusy(v){["go","gom","gos","goa"].forEach(i=>$(i).disabled=v)}

async function run(path,init){
  if(busy)return null;busy=true;setBusy(true);
  const log=$("log");log.innerHTML="";$("out").innerHTML="";$("progress").classList.remove("hide");
  const t0=performance.now();
  const add=(m,c="")=>{const li=document.createElement("li");li.className=c;li.textContent=`${((performance.now()-t0)/1000).toFixed(1)}s  ${m}`;log.appendChild(li)};
  try{
    const r=await fetch(path,init);
    if(!r.ok){let d="";try{d=(await r.json()).detail}catch{}throw new Error(d||("HTTP "+r.status))}
    const rd=r.body.getReader(),dec=new TextDecoder();let buf="",result=null;
    for(;;){
      const {done,value}=await rd.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      let i;while((i=buf.indexOf("\n\n"))>=0){
        const chunk=buf.slice(0,i);buf=buf.slice(i+2);
        if(!chunk.startsWith("data: "))continue;
        const ev=JSON.parse(chunk.slice(6));
        if(ev.type==="progress")add(ev.message);
        else if(ev.type==="result")result=ev.data;
        else if(ev.type==="error")throw new Error(ev.message);
      }
    }
    if(!result)throw new Error("No result received");
    add("Done","ok");return result;
  }catch(e){add("Error: "+e.message,"bad");$("out").innerHTML=`<div class="card warn">${esc(e.message)}</div>`;return null}
  finally{busy=false;setBusy(false)}
}
const post=(o)=>({method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(o)});

function reportHTML(d){
  const oc=d.official_contacts;
  return `<div class="card">
    <span class="badge ${d.risk_level}">${d.risk_level} · ${d.risk_score}/100</span>
    <small> confidence ${esc(d.confidence)} · ${esc(d.input_type)} · ${esc(d.normalized_value)}</small>
    <p>${esc(d.summary)}</p>
    ${d.warnings.map(w=>`<p class="warn">⚠ ${esc(w)}</p>`).join("")}
    ${list("Risk factors",d.risk_factors)}${list("What to do",d.recommended_actions)}${list("Not verified",d.unverified_points)}
    ${oc?`<h3>Official contacts: ${esc(oc.display_name)} <small>(${oc.source==="discovered"?"discovered via live search":"curated list"})</small></h3>
      <ul><li>Websites: ${esc(oc.domains.join(", "))}</li>
      <li>Helplines (list): ${esc(oc.helplines.join(", ")||"none on file")}</li>
      <li>Seen on official site just now: ${oc.live_checked?esc(oc.live_helplines.join(", ")||"no numbers found in snippets"):"not checked"}</li></ul>
      <small>Always confirm numbers on the brand's own website or app.</small>`:""}
    <h3>Why (signals)</h3><ul>${d.signals.map(s=>`<li><b>${esc(s.signal_name)}</b> (${s.score_impact>0?"+":""}${s.score_impact}): ${esc(s.description)}</li>`).join("")}</ul>
    <h3>Evidence (${d.evidence.length})</h3>
    ${d.evidence.map(e=>`<div class="ev"><small>${esc(e.source_type)}${e.relevance_notes?" · "+esc(e.relevance_notes):""}</small><br><a href="${safe(e.url)}" target="_blank" rel="noopener noreferrer">${esc(e.title||e.url)}</a><br><small>${esc(e.snippet)}</small></div>`).join("")}
    <p><button onclick="share()">Share summary</button></p></div>`;
}
function messageHTML(d){
  return `<div class="card"><span class="badge ${d.overall_risk_level}">${d.overall_risk_level} · ${d.overall_risk_score}/100</span>
    <p><b>Scam type:</b> ${esc(d.scam_type)} ${d.brand?`· <b>Claims to be:</b> ${esc(d.brand)}`:""}</p>
    <div class="chips">${d.tactics.map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div></div>`+d.reports.map(reportHTML).join("");
}
function share(){
  if(!last)return;
  const d=last.reports?{risk_level:last.overall_risk_level,risk_score:last.overall_risk_score,summary:last.scam_type}:last;
  const t=`ScamShield India: ${d.risk_level} risk (${d.risk_score}/100). ${d.summary||""}\nIf money was lost, call 1930.`;
  navigator.share?navigator.share({text:t}).catch(()=>{}):navigator.clipboard.writeText(t).then(()=>alert("Copied"));
}

$("go").onclick=async()=>{
  const q=$("q").value.trim();if(q.length<3)return;
  const d=await run("/api/v1/investigate/stream",post({query:q,claimed_brand:$("b").value.trim()||null,language:$("lang").value}));
  if(d){last=d;$("out").innerHTML=reportHTML(d)}
};
$("gom").onclick=async()=>{
  const m=$("m").value.trim();if(m.length<5)return;
  const d=await run("/api/v1/analyze-message/stream",post({message:m,language:$("lang").value}));
  if(d){last=d;$("out").innerHTML=messageHTML(d)}
};
$("gos").onclick=async()=>{
  const f=$("f").files[0];if(!f)return;
  const fd=new FormData();fd.append("file",f);fd.append("language",$("lang").value);
  const d=await run("/api/v1/analyze-screenshot/stream",{method:"POST",body:fd});
  if(d){last=d;$("out").innerHTML=messageHTML(d)}
};
$("goa").onclick=async()=>{
  const n=$("an").value.trim();if(n.length<2)return;setBusy(true);$("out").innerHTML="";
  try{
    const r=await fetch("/api/v1/check-app",post({app_name:n,claimed_brand:$("ab").value.trim()||null}));
    const d=await r.json();if(!r.ok)throw new Error(d.detail||r.status);
    const row=a=>`<li><a href="${safe(a.link)}" target="_blank" rel="noopener noreferrer">${esc(a.title)}</a> <small>${esc(a.developer||"developer unknown")}</small></li>`;
    $("out").innerHTML=`<div class="card"><b>${esc(d.verdict)}</b>
      ${d.presumed_official?`<h3>Presumed official (top result)</h3><ul>${row(d.presumed_official)}</ul>`:""}
      ${(d.possible_clones||[]).length?`<h3>Possible clones</h3><ul>${d.possible_clones.map(row).join("")}</ul>`:""}
      <p><small>${esc(d.note)}</small></p></div>`;
  }catch(e){$("out").innerHTML=`<div class="card warn">${esc(e.message)}</div>`}
  setBusy(false);
};

const COL={LOW:"#22c55e",MEDIUM:"#eab308",HIGH:"#f97316",CRITICAL:"#ef4444"};
function bars(o,colors){
  const e=Object.entries(o||{}).sort((a,b)=>b[1]-a[1]).slice(0,6),mx=Math.max(1,...e.map(x=>x[1]));
  return e.length?e.map(([k,v])=>`<div class="bar"><span>${esc(k)}</span><i style="width:${Math.round(v/mx*100)}%;background:${(colors&&colors[k])||"var(--ac)"}"></i>${v}</div>`).join(""):"<div class='mut'>No data yet</div>";
}
async function loadDash(){
  try{
    const [s,a,h]=await Promise.all([fetch("/api/v1/stats").then(r=>r.json()),fetch("/api/v1/alerts").then(r=>r.json()),fetch("/health").then(r=>r.json())]);
    const st=s.stats,sp=s.serpapi,ac=sp.account||{};
    const risky=(st.by_level.HIGH||0)+(st.by_level.CRITICAL||0);
    const left=ac.total_searches_left??ac.plan_searches_left;
    $("health").innerHTML=[["SerpApi",h.serpapi_configured],["AI: "+(h.llm_provider||"off"),!!h.llm_provider],["Safe Browsing",h.safe_browsing_configured],["VirusTotal",h.virustotal_configured]]
      .map(([n,v])=>`<span class="chip ${v?"ok":"no"}">${esc(n)} ${v?"✓":"✗"}</span>`).join("");
    $("dash").innerHTML=`
    <div class="grid" style="margin-top:14px">
      <div class="stat"><b>${st.total}</b>checks done</div>
      <div class="stat"><b>${st.total?Math.round(risky/st.total*100):0}%</b>high / critical</div>
      <div class="stat"><b>${left??"–"}</b>SerpApi credits left</div>
      <div class="stat"><b>${sp.searches_today}/${sp.daily_budget}</b>searches today (cap)</div>
      <div class="stat"><b>${sp.cache_hits}</b>served from cache</div>
    </div>
    <div class="card"><h3>Risk levels</h3>${bars(st.by_level,COL)}<h3>Input types</h3>${bars(st.by_type)}
      <h3>Scam types in pasted messages</h3>${bars(st.by_scam_type)}<h3>Most checked brands</h3>${bars(st.brands)}
      <h3>Most common signals</h3>${bars(st.signals)}</div>
    <div class="card"><h3>Latest scam alerts (live Google News via SerpApi)</h3>
      ${(a.items||[]).map(n=>`<div class="ev"><a href="${safe(n.link)}" target="_blank" rel="noopener noreferrer">${esc(n.title)}</a><br><small>${esc(n.source)} ${esc(n.date||"")}</small></div>`).join("")||"<div class='mut'>No alerts (check SerpApi key).</div>"}</div>
    <div class="card"><h3>Recent checks (identifiers masked)</h3><table><tr><th>Time</th><th>Type</th><th>Item</th><th>Brand</th><th>Risk</th></tr>
      ${st.recent.map(r=>`<tr><td>${new Date(r.ts*1000).toLocaleTimeString()}</td><td>${esc(r.type)}</td><td>${esc(r.id)}</td><td>${esc(r.brand)}</td><td><span class="badge ${r.level}">${r.score}</span></td></tr>`).join("")}</table></div>`;
  }catch(e){$("dash").innerHTML=`<div class="card warn">Dashboard error: ${esc(e.message)}</div>`}
}
fetch("/health").then(r=>r.json()).then(h=>{$("health").innerHTML=[["SerpApi",h.serpapi_configured],["AI: "+(h.llm_provider||"off"),!!h.llm_provider]].map(([n,v])=>`<span class="chip ${v?"ok":"no"}">${esc(n)} ${v?"✓":"✗"}</span>`).join("")});
</script></body></html>
